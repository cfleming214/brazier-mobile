# DROP-61 scenario 7: confirmed event with countdown → set reminder → convert to watch.
# Rumored/official merge (scenario 8) and the T-10 burst tier are asserted in the worker
# integration suite (calendar-db.test.ts, pipeline.test.ts) where the clock can be controlled.
appId: com.simpledesign.brazier
tags: [calendar]
---
- runFlow:
    file: ../subflows/sign-in.yaml
- tapOn:
    id: 'tab-calendar'
- assertVisible: 'Pokémon Center preorder: Mega Evolution ETB'
- tapOn: 'Pokémon Center preorder: Mega Evolution ETB'
- tapOn:
    id: 'remind-15'
- assertVisible:
    id: 'remind-off'
- tapOn:
    id: 'watch-from-event'
- extendedWaitUntil:
    visible:
      id: 'configure-product-name'
    timeout: 10000
- tapOn:
    id: 'save-watch'
- assertVisible:
    id: 'watch-product-name'
